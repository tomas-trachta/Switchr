name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $projPath = 'Switchr\Switchr.vcxproj'
          $projXml = [xml](Get-Content $projPath)

          $versionGroup = $projXml.Project.PropertyGroup | Where-Object { $_.SwitchrVersionMajor }
          if (-not $versionGroup) {
              throw "Could not find SwitchrVersionMajor/Minor/Patch in $projPath"
          }
          $vMajor = [int]$versionGroup.SwitchrVersionMajor.Trim()
          $vMinor = [int]$versionGroup.SwitchrVersionMinor.Trim()
          $vPatch = [int]$versionGroup.SwitchrVersionPatch.Trim() + 1
          $newVersion = "$vMajor.$vMinor.$vPatch"

          $raw = Get-Content $projPath -Raw
          $raw = $raw -replace '(?<=<SwitchrVersionMajor>)\d+(?=</SwitchrVersionMajor>)', $vMajor
          $raw = $raw -replace '(?<=<SwitchrVersionMinor>)\d+(?=</SwitchrVersionMinor>)', $vMinor
          $raw = $raw -replace '(?<=<SwitchrVersionPatch>)\d+(?=</SwitchrVersionPatch>)', $vPatch
          Set-Content -Path $projPath -Value $raw -NoNewline

          $issPath = 'installer\Switchr.iss'
          $iss = Get-Content $issPath -Raw
          $iss = $iss -replace '#define AppVersion "\d+\.\d+\.\d+"', "#define AppVersion `"$newVersion`""
          Set-Content -Path $issPath -Value $iss -NoNewline

          Write-Host "Bumped version to $newVersion"
          "version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Switchr\Switchr.vcxproj installer\Switchr.iss
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\installer\build.ps1

      - name: Create GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.bump.outputs.version }}"
          $installer = Get-ChildItem "installer\output" -Filter *.exe | Select-Object -First 1
          gh release create "v$version" $installer.FullName `
            --title "Switchr $version" `
            --generate-notes
